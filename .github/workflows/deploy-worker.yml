name: Deploy chatbot worker

# Push-triggered auto-deploy is OFF until CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are added as repo secrets (Settings > Secrets and
# variables > Actions) — without them every push was failing and sending
# failure-notification emails for no reason, since deploys have all been
# manual (`npm run deploy`) so far and the site was never actually broken.
# Once those two secrets exist, restore the `push:` block below (see git
# history on this file, or worker/README.md's "Deploying to production")
# to go back to auto-deploy on every relevant push.
on:
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install worker dependencies
        run: npm ci

      - name: Rebuild knowledge base
        run: node ../scripts/build-knowledge.cjs

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
