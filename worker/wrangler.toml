name = "paul-chatbot"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Only the frontend origin may call this Worker (see src/index.js's CORS check).
[vars]
ALLOWED_ORIGIN = "https://geddie212.github.io"

# Created by `wrangler d1 create paul-chatbot-db` — paste the database_id it
# prints back in here before your first deploy. See ../README.md.
[[d1_databases]]
binding = "DB"
database_name = "paul-chatbot-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# GEMINI_API_KEY and IP_HASH_SALT are secrets, not vars — they're never
# written to this file (which is committed to git). See ../README.md for
# how to set them for local dev (.dev.vars) and production (wrangler secret).
